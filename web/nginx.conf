# MindFlow 反向代理配置。
#
# 职责：① 托管前端静态文件 ② 把 /api 转给后端 ③ 提供 HTTPS 的落点。
#
# ## 为什么需要反向代理（而不是让前端直连后端）
#
# 前端用相对路径 `/api`（见 `src/api/http.ts`），因此只要
# 前端与后端**同域**，浏览器就认为是同源请求 —— 不需要 CORS，
# 也不需要把后端地址暴露给浏览器。
#
# ## 本文件里有三处设置如果漏了，会"看起来能用但随机失败"
#
# 这三条不是可选优化，而是**功能性前提**。下面逐个说明。

server {
    listen 80;
    server_name _;

    # ================================================================
    # 上游地址用**变量 + 动态解析**
    # ================================================================
    #
    # ⚠️ 这一段的写法不是风格问题，它解决两个真实的运维故障。
    #
    # **故障 A：后端没起来时，nginx 拒绝启动。**
    # 若直接写 `proxy_pass http://backend:8000;`，nginx 会在
    # **解析配置时**就去查 `backend` 这个主机名。查不到就
    # `[emerg] host not found in upstream` 并**退出** ——
    # 于是整个站点（包括静态的登录页）都打不开。
    # 而那时后端可能只是在慢启动（Milvus 依赖链要几十秒）。
    #
    # **故障 B：重新部署后端后，nginx 仍指向旧 IP。**
    # 静态写法下，nginx 只在启动时解析一次并缓存。
    # 后端容器重建后 IP 变了，nginx 还在往旧地址发请求 ——
    # 表现为**每 10 秒 502 一次**，直到有人手动重启 nginx。
    # 而重启 nginx 是那种"没人会想到"的操作。
    #
    # 解法：`resolver` + 变量 `$backend_upstream`。
    # 变量形式的 `proxy_pass` 会**在运行时**解析主机名，
    # 并按 `valid=10s` 重新解析。于是：
    #   - 后端没起来 → nginx 正常启动，/api 返回 502（静态页仍可用）
    #   - 后端换 IP → 最多 10 秒后自动跟上
    #
    # `127.0.0.11` 是 Docker 内置 DNS 服务器（固定地址）。
    # 这里用固定 IP 而不是容器名：DNS 服务器本身不能靠 DNS 解析，
    # 否则就是先有鸡还是先有蛋。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 前端静态文件。
    root /usr/share/nginx/html;
    index index.html;

    # ================================================================
    # ① 请求体大小上限
    # ================================================================
    #
    # ⚠️ **nginx 默认只允许 1 MB**。
    #
    # 而后端允许上传 5 MB（`settings.max_upload_bytes`）。
    # 不改这里的话，传一个 1.2 MB 的简历会被 **nginx 直接拒掉**
    # 并返回 413，请求根本到不了后端。
    #
    # 那时用户看到的错误与"文件太大"完全无关，而后端日志里
    # **什么都没有**（请求没到达）—— 排查会从后端开始，
    # 一路找不到原因。
    #
    # 取 8 MB：给 multipart 的边界与字段开销留余量
    # （5 MB 文件的实际请求体会略大于 5 MB）。
    client_max_body_size 8m;

    # ================================================================
    # ② 上游超时
    # ================================================================
    #
    # ⚠️ **nginx 默认 60 秒**。而这个应用的这些接口会超过它：
    #
    # | 接口 | 实测耗时 |
    # | --- | --- |
    # | 开始面试（生成首题）| 15–60 秒，冷启动更久 |
    # | 追问（分析 + 生成）| 15–20 秒 |
    # | 结束面试（整场评价）| 可能超过 60 秒 |
    #
    # 超时后 nginx 返回 504，而**后端仍在继续跑**（它不知道
    # 客户端已经放弃），于是一次 LLM 调用白花钱、额度已扣、
    # 而用户什么也没拿到。
    #
    # 取 300 秒：覆盖最慢的评价路径，同时不让连接永久挂着。
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ================================================================
    # ③ 真实客户端 IP（限流依赖它）
    # ================================================================
    #
    # ⚠️ 这里**必须用 `$remote_addr` 覆写**，不能用
    # `$proxy_add_x_forwarded_for`（那是**追加**）。
    #
    # 原因：后端的 `_client_ip()` 取 `X-Forwarded-For` 的
    # **第一个**地址。而客户端可以自己伪造这个头：
    #
    #     攻击者发：X-Forwarded-For: 1.2.3.4
    #     若用 $proxy_add_x_forwarded_for → "1.2.3.4, <真实IP>"
    #     → 后端取第一个 → 看到 1.2.3.4 → 每次换一个就能绕过限流
    #
    # 用 `$remote_addr` 覆写后，客户端伪造的值被丢弃，
    # 后端拿到的永远是 nginx 亲眼看到的地址。
    #
    # ⚠️ 若将来在前面再加 CDN / 云负载均衡，这里要改成
    # 采信 CDN 的固定头（例如 `CF-Connecting-IP`），
    # 否则所有用户会共用 CDN 的 IP 而被限流误伤。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    # ================================================================
    # 前端路由（SPA）
    # ================================================================
    #
    # 前端的路由是 History 模式（`/history`、`/interviews/12` 等
    # 都是浏览器地址栏里的真实路径）。直接刷新这些地址时，
    # nginx 会去找 `/history` 这个文件 —— 找不到就 404。
    #
    # `try_files ... /index.html` 把所有非文件请求交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html **不缓存**。
    #
    # 它引用的资源文件名带内容哈希（`index-a1b2c3.js`），
    # 因此新版本部署后 index.html 必须立刻更新 ——
    # 否则用户会长时间停留在旧版本，直到缓存过期。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 带哈希的静态资源**长期缓存**。
    #
    # 内容变了文件名就变，所以缓存一年是安全的 ——
    # 这是"部署新版本后用户立刻拿到新代码"的关键：
    # 唯一需要刷新的文件是 index.html。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ================================================================
    # 后端 API
    # ================================================================
    location /api/ {
        # 用变量形式（见上方 resolver 的说明）：
        # 变量 proxy_pass 会把**原始 URI** 原样转发，
        # 因此 `/api/auth/login` 会到后端的 `/api/auth/login`。
        proxy_pass $backend_upstream;

        # 与上面的超时/真实 IP 设置一致（server 级已设，
        # 这里重复一次是为了让本 location 单独读起来完整）
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # 不缓冲响应：LLM 生成的响应是"一次性大 JSON"，
        # 缓冲只会让用户多等一个额外的写盘周期。
        proxy_buffering off;
    }

    # 健康检查直通后端（供外部监控用）
    location = /api/health {
        proxy_pass $backend_upstream/api/health;
        access_log off;
    }

    # 安全响应头。
    #
    # 这几条成本为零，但能挡掉一整类常见问题：
    # - nosniff：阻止浏览器把 JSON 当 HTML 解析（XSS 的一个入口）
    # - DENY：禁止被别的站点用 iframe 嵌入（点击劫持）
    # - referrer-policy：访问第三方时不泄露本站路径
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
