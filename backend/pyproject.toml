[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langgraph>=1.2.11",
    "openai>=3.14.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.2",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
# 开发期工具，不进运行时依赖。
dev = [
    # 界面走查（`app/core/ui_walkthrough.py`）。
    # 单独成组，避免让运行时依赖带上一整套浏览器驱动。
    "playwright>=1.63.0",

    # 数据库迁移。
    #
    # ⚠️ 此前**没有声明**，但 `alembic/` 下有 12 个迁移文件。
    # 后果：`uv run alembic` 实际走的是全局 Python 里装的 alembic，
    # 不是项目环境 —— 换一台机器（或 CI）就跑不了迁移，
    # 而报错是 `No module named 'alembic.config'`（因为
    # `import alembic` 会命中项目根目录下的 `alembic/` 包，
    # 把真实的缺失伪装成"模块缺了个子模块"，很难一眼看出）。
    "alembic>=1.18.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
